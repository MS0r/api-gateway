services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api-workspace
    volumes:
      - .:/api-gateway:cached
    depends_on:
      - db
      - sandbox
    command: /bin/sh -c "while sleep 1000; do :; done"
    tty: true
  db:
    image: postgres:alpine3.22
    container_name: test-postgres-api
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
  sandbox:
    image: mickael279/sandbox-erlang:latest
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    container_name: sandbox
    depends_on:
      broker:
        condition: service_healthy
        restart: true
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
  broker:
    image: rabbitmq:4.2.3-management
    container_name: rabbitmq
    hostname: ${RABBITMQ_HOST}
    ports:
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
volumes:
  pgdata: {}