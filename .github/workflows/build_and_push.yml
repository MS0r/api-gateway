name: Api Gateway CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  Tests:
    name: Run Tests
    runs-on: ubuntu-latest
    container: python:3.12-slim

    services:
      db:
        image: postgres
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: mydb
        options: >-
          --health-cmd "pg_isready -U user -d mydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      broker:
        image: rabbitmq:alpine
        env:
          RABBITMQ_DEFAULT_USER: usering
          RABBITMQ_DEFAULT_PASS: passing
        options: >-
          -h rabbit_host
          --health-cmd "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"
          --health-interval 1m30s
          --health-timeout 30s
          --health-retries 5
          --health-start-period 30s
      sandbox:
        image: mickael279/sandbox-erlang:latest
        env:
          RABBITMQ_DEFAULT_USER: usering
          RABBITMQ_DEFAULT_PASS: passing
          RABBITMQ_HOST: rabbit_host
        options: >-
          --health-cmd "curl http://localhost:4000/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements.dev.txt ]; then pip install -r requirements.dev.txt; fi
            
      - name: Install PostgreSQL client
        run: apt-get update && apt-get install -y postgresql-client
        
      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h db -p 5432 -U user; do
            echo "Waiting for Postgres..."
            sleep 2
          done
          
      - name: Run unit and integration Tests
        run: |
          pytest --maxfail=1 --disable-warnings -q
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://user:123@db/mydb
          SECRET_KEY: 123
          RABBITMQ_DEFAULT_USER: usering
          RABBITMQ_DEFAULT_PASS: passing
          RABBITMQ_HOST: rabbit_host

  Build_and_Push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: Tests
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/api-gateway-erlang:latest
            ${{ vars.DOCKERHUB_USERNAME }}/api-gateway-erlang:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          file: Dockerfile.server
          cache-from: type=gha
          cache-to: type=gha,mode=max
